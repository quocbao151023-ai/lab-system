<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống Lab</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
</head>

<body>

<main class="login-page">

    <section class="login-wrapper">

        <!-- KHỐI BÊN TRÁI -->
        <div class="login-left">

            <div class="left-content">

                <img 
                    src="{{ url_for('static', filename='images/logo-vlu.png.png') }}"
                    alt="Van Lang University"
                    class="logo-vlu"
                >

                <!-- CỤM CHỮ ĐƯỢC BỌC LẠI ĐỂ CSS CĂN GIỮA -->
                <div class="left-text-group">

                    <h1>
                        HỆ THỐNG QUẢN LÝ<br>
                        PHÒNG LAB
                    </h1>

                    <div class="divider">
                        <span></span>
                        <i></i>
                        <span></span>
                    </div>

                    <p>
                        Khoa Kỹ thuật và Quản lý Công nghiệp<br>
                        Trường Đại học Văn Lang
                    </p>

                </div>

            </div>

            <img 
                src="{{ url_for('static', filename='images/net-vlu.png.png') }}"
                alt="Van Lang building"
                class="net-vlu"
            >

        </div>

        <!-- KHỐI BÊN PHẢI -->
        <div class="login-right">

            <div class="login-card">

                <h2>Đăng nhập</h2>

                <p class="login-desc">
                    Vui lòng đăng nhập để truy cập hệ thống<br>
                    quản lý phòng Lab
                </p>

                <form method="POST">

                    <div class="form-group">
                        <label for="email">Email</label>

                        <div class="input-box">
                            <span class="input-icon">✉</span>

                            <input 
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Nhập email"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Mật khẩu</label>

                        <div class="input-box">
                            <span class="input-icon">🔒</span>

                            <input 
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Nhập mật khẩu"
                                required
                            >
                        </div>
                    </div>

                    {% if error %}
                        <div class="error-message">
                            {{ error }}
                        </div>
                    {% endif %}

                    <button type="submit">
                        Đăng nhập
                    </button>

                </form>

                <p class="login-note">
                    Lưu ý: người dùng nên tắt chức năng dịch tự động<br>
                    của trình duyệt.
                </p>

            </div>

        </div>

    </section>

</main>

</body>
</html>
